{% extends "base.html" %}
{% block content %}
<div class="card sf-card p-4" style="max-width:500px">
  <h5>Delete {{ kind }}?</h5>
  <p class="text-muted">"{{ obj }}" will be permanently removed.</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger">Delete</button>
    <a href="javascript:history.back()" class="btn btn-link">Cancel</a>
  </form>
</div>
{% endblock %}
