{% extends "base.html" %}
{% block title %}AI Insights{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0">Insights</h3>
  <form method="post">{% csrf_token %}<button class="btn btn-accent btn-sm"><i class="fa-solid fa-rotate"></i> Refresh</button></form>
</div>
<div class="row g-3">
{% for i in items %}
  <div class="col-md-6"><div class="card sf-card p-3 d-flex flex-row align-items-start gap-3">
    <i class="fa-solid fa-lightbulb sf-accent fs-4"></i>
    <div><p class="mb-1">{{ i.text }}</p><span class="badge text-bg-light">{{ i.get_source_display }}</span></div>
  </div></div>
{% empty %}<div class="col-12"><p class="text-muted">No insights yet. Add transactions, then refresh.</p></div>{% endfor %}
</div>
{% endblock %}
