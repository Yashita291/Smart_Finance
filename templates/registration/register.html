{% extends "base.html" %}
{% block public %}
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh;background:#0d1b2a">
  <div class="card sf-card p-4" style="width:440px">
    <h3 class="mb-3 sf-accent"><i class="fa-solid fa-wallet"></i> SmartFinance</h3>
    <h5 class="mb-3">Create your account</h5>
    <form method="post">{% csrf_token %}
      {% for f in form %}
        <div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}
          {% if f.help_text %}<div class="form-text small">{{ f.help_text|safe }}</div>{% endif %}
          {% if f.errors %}<div class="text-danger small">{{ f.errors|striptags }}</div>{% endif %}
        </div>
      {% endfor %}
      <button class="btn btn-accent w-100">Register</button>
    </form>
    <p class="text-center mt-3 small">Already have an account? <a href="{% url 'login' %}">Login</a></p>
  </div>
</div>
{% endblock %}
